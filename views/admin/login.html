<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Drip Imports</title>
  <link rel="icon" href="/img/logo.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <div class="form-card">
      <img src="/img/logo.png" alt="Drip Imports" style="height:60px; margin:0 auto 20px; display:block;" />
      <h2>Painel administrativo</h2>
      <p class="subtitle">Acesso restrito</p>
      <div id="admin-login-alert" class="alert alert-error"></div>
      <form id="admin-login-form">
        <div class="form-group">
          <label>Senha de administrador</label>
          <input type="password" name="password" required />
        </div>
        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
      </form>
      <p class="form-switch"><a href="/">Voltar para a loja</a></p>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
