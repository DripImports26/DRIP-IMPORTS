<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produtos - Admin Drip Imports</title>
  <link rel="icon" href="/img/logo.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand"><img src="/img/logo.png" alt="Drip Imports" /></a>
      <div class="header-actions">
        <span style="color:var(--muted); font-size:0.85rem;">Painel administrativo</span>
        <button class="btn btn-outline btn-sm" id="admin-logout-btn">Sair</button>
      </div>
    </div>
  </header>

  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a href="/admin/dashboard" class="active">Produtos</a>
      <a href="/admin/pedidos">Pedidos</a>
      <a href="/catalogo">Ver loja</a>
    </aside>
    <main class="admin-main">
      <div class="admin-header">
        <h2 style="margin:0;">Produtos</h2>
        <button class="btn btn-primary" id="new-product-btn">+ Novo produto</button>
      </div>
      <div id="admin-products-mount"><div class="spinner"></div></div>
    </main>
  </div>

  <div class="modal-overlay" id="product-modal">
    <div class="modal-card">
      <h3 id="product-modal-title">Novo produto</h3>
      <form id="product-form">
        <div class="form-group">
          <label>Nome</label>
          <input name="name" required />
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Categoria</label>
            <select name="category" required>
              <option value="roupas">Roupas</option>
              <option value="tenis">Tênis</option>
              <option value="acessorios">Acessórios</option>
            </select>
          </div>
          <div class="form-group">
            <label>Preço (R$)</label>
            <input name="price" required placeholder="199.90" />
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Tamanhos (separados por vírgula)</label>
            <input name="sizes" placeholder="P, M, G, GG" />
          </div>
          <div class="form-group">
            <label>Estoque</label>
            <input name="stock" type="number" min="0" value="0" />
          </div>
        </div>
        <div class="form-group">
          <label>URL da imagem</label>
          <input name="image" placeholder="/img/products/exemplo.jpg" />
        </div>
        <div class="form-group">
          <label>Descrição</label>
          <textarea name="description" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label><input type="checkbox" name="featured" style="width:auto; margin-right:8px;" /> Produto em destaque</label>
        </div>
        <div style="display:flex; gap:10px; margin-top:20px;">
          <button type="button" class="btn btn-outline btn-block" id="cancel-product-btn">Cancelar</button>
          <button type="submit" class="btn btn-primary btn-block">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
