<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrinho - Drip Imports</title>
  <link rel="icon" href="/img/logo.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app-header"></div>

  <div class="container">
    <div class="section-title" style="margin-top:30px;">
      <h2>Seu carrinho</h2>
    </div>

    <div class="cart-layout">
      <div id="cart-items"></div>
      <div class="summary-card" id="cart-summary">
        <div class="summary-row total">
          <span>Total</span>
          <span id="cart-total">R$ 0,00</span>
        </div>
        <a href="/checkout" class="btn btn-primary btn-block" style="margin-top:16px;">Finalizar compra</a>
        <a href="/catalogo" class="btn btn-outline btn-block" style="margin-top:10px;">Continuar comprando</a>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="/js/main.js"></script>
  <script src="/js/cart.js"></script>
  <script>mountLayout("");</script>
</body>
</html>
