<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo - Drip Imports</title>
  <link rel="icon" href="/img/logo.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app-header"></div>

  <div class="container">
    <div class="section-title" style="margin-top:30px;">
      <h2>Catálogo</h2>
    </div>

    <div class="filters-bar">
      <button class="filter-pill" data-categoria="">Todos</button>
      <button class="filter-pill" data-categoria="roupas">Roupas</button>
      <button class="filter-pill" data-categoria="tenis">Tênis</button>
      <button class="filter-pill" data-categoria="acessorios">Acessórios</button>
      <input type="search" id="catalog-search" class="search-input" placeholder="Buscar produtos..." />
    </div>

    <div class="product-grid" id="catalog-grid">
      <div class="spinner"></div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="/js/main.js"></script>
  <script src="/js/catalog.js"></script>
  <script>mountLayout("catalogo");</script>
</body>
</html>
